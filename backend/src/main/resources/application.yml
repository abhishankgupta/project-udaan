spring:
  application:
    name: udaan-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/udaan}
    username: ${SPRING_DATASOURCE_USERNAME:udaan}
    password: ${SPRING_DATASOURCE_PASSWORD:udaan}
    hikari:
      # Neon's free tier has few connections; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

udaan:
  environment: ${UDAAN_ENVIRONMENT:local}
  version: ${UDAAN_VERSION:dev}
  cors-origins: ${UDAAN_CORS_ORIGINS:http://localhost:5173}
  auth:
    # Optional: 32+ characters. If unset, a random key is used per restart (see AuthProperties).
    jwt-secret: ${UDAAN_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    otp:
      ttl: 5m
      max-attempts: 5
      max-sends-per-window: 3
      send-window: 15m
      # Until an SMS provider is connected, non-production environments show the code on screen.
      expose-code-outside-production: true
  problems:
    # Until the moderation dashboard (step 6), test environments publish new problems immediately.
    auto-approve-outside-production: true
    max-per-user-per-day: 5

logging:
  level:
    root: INFO
