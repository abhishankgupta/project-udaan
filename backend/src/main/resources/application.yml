spring:
  application:
    name: udaan-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/udaan}
    username: ${SPRING_DATASOURCE_USERNAME:udaan}
    password: ${SPRING_DATASOURCE_PASSWORD:udaan}
    hikari:
      # Neon's free tier has few connections; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

udaan:
  environment: ${UDAAN_ENVIRONMENT:local}
  version: ${UDAAN_VERSION:dev}
  cors-origins: ${UDAAN_CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
