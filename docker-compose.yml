# Local development services. Start with:  docker compose up -d
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: udaan
      POSTGRES_USER: udaan
      POSTGRES_PASSWORD: udaan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udaan -d udaan"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage standing in for Cloudflare R2 (used once media uploads land).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: udaan
      MINIO_ROOT_PASSWORD: udaan-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
