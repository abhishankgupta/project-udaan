name: CI

# Runs on every pull request, and is reused by the deploy workflow so nothing
# reaches test or production without passing the same checks.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: udaan
          POSTGRES_USER: udaan
          POSTGRES_PASSWORD: udaan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udaan -d udaan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew --no-daemon test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/udaan
          SPRING_DATASOURCE_USERNAME: udaan
          SPRING_DATASOURCE_PASSWORD: udaan
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  web:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
